<head>

<body>
    <div class="header">
        <a href="../Week-12/random-password/index.html"><button>Next</button></a> <!-- Left side button -->

    <h1>Random password Generater</h1>
    <div class="display">
        <div class="displayFlex">
        <input type="text" id="password" placeholder="password">
        <img src="images/copy.png" alt="" onclick="copyPassword()" >
    </div>
       <!-- <input type="text" class="passwordLength" id="passwordLength" placeholder="Enter password length">-->
        <select name="" id="passwordLength">
            <option value="">Seleclt length</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
        </select>
        <button onclick="createPassword()" id="button"> <i class="fas fa-key"></i> Generate password</button>

    
    </div>
    <script>
        const passwordBox = document.getElementById("password");
        //const length = 6;
        const passwordLength = document.getElementById('passwordLength');
        const length = passwordLength.value;
        //const length = passwordLength.value;
        const upperCase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowerCase = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+";
        const allChars = upperCase + lowerCase + numbers + symbool;
        
        function createPassword() {
            const passwordLength = document.getElementById('passwordLength');
        const length = passwordLength.value;
        if(length === ''){
            alert('Select legth firts');
            return;
        }
       
            let password = "";
            password += upperCase[Math.floor(Math.random() * upperCase.length)];
            password += lowerCase[Math.floor(Math.random() * lowerCase.length)];
            password += numbers[Math.floor(Math.random() * numbers.length)];
            password += symbool[Math.floor(Math.random() * symbool.length)];
            while (length > password.length) {
                password += allChars[Math.floor(Math.random() * allChars.length)];
            }
            passwordBox.value = password;
        }
    

        function copyPassword(){
            passwordBox.select();
            document.execCommand("copy");
        }
    </script>
